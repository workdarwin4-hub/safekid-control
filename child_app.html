<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeKid Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Lock Screen Overlay -->
    <div id="lockOverlay" class="fixed inset-0 bg-red-950/95 backdrop-blur-xl z-50 hidden flex flex-col items-center justify-center text-center p-6">
        <i class="fa-solid fa-lock text-6xl mb-4 text-white animate-bounce"></i>
        <h1 class="text-3xl font-bold mb-2">تم قفل الجهاز</h1>
        <p class="text-red-200 text-sm">تواصل مع الادمن لإلغاء قفل الجهاز.</p>
    </div>

    <!-- Child Link Card -->
    <div class="bg-slate-800 p-8 rounded-3xl max-w-sm w-full border border-slate-700 shadow-2xl text-center space-y-6">
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto text-2xl">
            <i class="fa-solid fa-child-reaching"></i>
        </div>
        <div>
            <h2 class="text-xl font-bold">ربط جهاز الطفل</h2>
            <p class="text-xs text-slate-400 mt-1">اكتب الكود المكون من 6 ارقام</p>
        </div>
        <input id="childCodeInput" type="text" maxlength="6" placeholder="000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-2xl font-mono tracking-widest text-indigo-400 focus:outline-none focus:border-indigo-500">
        <button onclick="linkDevice()" class="w-full bg-indigo-600 hover:bg-indigo-700 py-3 rounded-xl font-bold transition">ربط الجهاز الآن</button>
    </div>

    <script>
        let linkedLicenseKey = null;

        function linkDevice() {
            const code = document.getElementById('childCodeInput').value.trim();
            if(code.length !== 6) return alert('الكود يتكون من 6 أرقام');

            db.ref(`childCodes/${code}`).once('value', snapshot => {
                const data = snapshot.val();
                if(!data) return alert('الكود غير صحيح أو منتهي الصلاحية');

                linkedLicenseKey = data.licenseKey;
                alert('تم ربط الجهاز بنجاح!');
                listenCommands();
            });
        }

        function listenCommands() {
            db.ref(`childCommands/${linkedLicenseKey}`).on('value', snapshot => {
                const cmd = snapshot.val();
                if(!cmd) return;
                if(cmd.command === 'lock') document.getElementById('lockOverlay').classList.remove('hidden');
                if(cmd.command === 'unlock') document.getElementById('lockOverlay').classList.add('hidden');
                if(cmd.command === 'alarm') alert('🚨 تنبيه وإنذار عاجل !');
            });
        }
    </script>
</body>
</html>
